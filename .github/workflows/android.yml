name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate curated YouTube playlists
        run: python3 tools/validate_youtube_catalog.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Test Android
        run: |
          for attempt in 1 2 3; do
            gradle :app:testDebugUnitTest --no-daemon && exit 0
            status=$?
            echo "Unit tests failed on attempt ${attempt}; retrying to recover transient dependency downloads."
            sleep 10
          done
          exit "$status"
      - name: Enable KVM for hardware-accelerated emulator
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator player smoke test
        id: player_smoke
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/run_android_smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinestream-emulator-diagnostics-${{ github.sha }}
          path: artifacts/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK
        if: always() && steps.player_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cinestream-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
