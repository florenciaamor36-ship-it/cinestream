name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate curated YouTube playlists
        run: python3 tools/validate_youtube_catalog.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Test Android
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Android emulator player smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: |
            timeout 300 sh -c 'ok=0; while [ "$ok" -lt 3 ]; do sdk=$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d "\r"); boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r"); packages=$(adb shell cmd package list packages 2>/dev/null | head -1); activity=$(adb shell cmd activity get-current-user 2>/dev/null | tr -d "\r"); if [ "$sdk" -ge 30 ] 2>/dev/null && [ "$boot" = 1 ] && [ -n "$packages" ] && [ "$activity" = 0 ]; then ok=$((ok+1)); else ok=0; fi; sleep 10; done'
            gradle :app:connectedDebugAndroidTest --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cinestream-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
